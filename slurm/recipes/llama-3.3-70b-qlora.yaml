# Bhaskera recipe: llama-3.3-70b-qlora
# Model    : meta-llama/Llama-3.3-70B-Instruct   (download to /scratch/<project>/<username>/models/Llama-3.3-70B-Instruct)
# Strategy : ddp + QLoRA 4-bit
# Measured on PARAM Rudra (Nov 2026, seq_len 4096, 2 x A100 80 GB per node):
#            39.1% MFU, 2.2 days/epoch on 8 nodes, 3.3 h on 128 nodes, 55 GB/GPU
# Nodes    : any node count
#
# Before use: replace every <project>/<username>, and set data.tokenized_path /
# data.val_tokenized_path to the two lines printed by the tokenize job.
# max_steps is 10 (a smoke test). After the smoke test, set it for a full run:
#   max_steps = (training-set tokens) / (tok/s x step_s from the [step] log line)
# Run with:  ./submit.sh recipes/llama-3.3-70b-qlora.yaml <nodes> <hours>
model:
  name: /scratch/<project>/<username>/models/Llama-3.3-70B-Instruct
  dtype: bfloat16
  attn_impl: flash_attention_2
  trust_remote_code: false
  use_liger_kernel: true
  quantization: qlora
data:
  name: local
  seq_len: 4096
  runtime_packing: true
  num_workers: 16
  tokenized_path: /scratch/<project>/<username>/cache/REPLACE_local_train_<hash>
  val_tokenized_path: /scratch/<project>/<username>/cache/REPLACE_local_val_<hash>
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - auto
  include_experts: false
  freeze_router: true
  modules_to_save: []
training:
  batch_size: 2
  grad_accum: 1
  lr: 0.0001
  weight_decay: 0.0
  max_steps: 10
  num_epochs: 1
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false
  eval_steps: 200
  eval_batch_size: 1
  target_eval_loss: null
  distributed:
    strategy: ddp
    fsdp:
      sharding_strategy: FULL_SHARD
      transformer_layer_cls: []
      param_dtype: bfloat16
      reduce_dtype: bfloat16
      buffer_dtype: bfloat16
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false
  eval_max_rows: 1000
checkpoint:
  enabled: true
  save_dir: /scratch/<project>/<username>/bhaskera-runs/checkpoints/llama-3.3-70b-qlora
  save_interval: 1                 # DDP/QLoRA: counted in EPOCHS - saves when the run ends (max_steps or epoch end)
  keep_last_n: 2
logging:
  tracker: mlflow
  project: bhaskera
  run_name: llama-3.3-70b-qlora
  mlflow_tracking_uri: ''
  log_gpu_every_n_steps: 10
monitoring:
  dashboard: true
  dashboard_host: 0.0.0.0
  dashboard_port: 8265
  metrics_export_port: 8080
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 5
