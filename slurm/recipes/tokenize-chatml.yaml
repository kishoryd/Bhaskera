# Bhaskera recipe: tokenize-chatml
# Tokenises your JSONL data once into a Parquet cache that every training run reuses.
# Use the SAME model and seq_len as the training recipe. Run with:  ./submit.sh tokenize recipes/tokenize-chatml.yaml
model:
  name: /scratch/<project>/<username>/models/Qwen3-14B
  trust_remote_code: false
data:
  name: local
  format: chatml                # chatml | alpaca | sharegpt
  format_options:
    messages_field: messages
  train_path: /scratch/<project>/<username>/data/train.jsonl
  val_path: /scratch/<project>/<username>/data/val.jsonl
  seq_len: 4096
  cache_dir: /scratch/<project>/<username>/cache
  overwrite_cache: false
  num_workers: 46               # CPU workers on one 48-core node
  tokenize_batch_size: 64
  tokenize_compression: snappy
