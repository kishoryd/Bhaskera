# ExaAI recipe: tokenize-plaintext
# Tokenises plain text (books, code, articles) with no columns, once, into a Parquet cache.
# Use the SAME model and seq_len as the training recipe. Run with:  ./submit.sh tokenize recipes/tokenize-plaintext.yaml
model:
  name: /scratch/<project>/<username>/models/Qwen3-14B
  trust_remote_code: false
data:
  name: local
  train_path: /scratch/<project>/<username>/data/books/          # a folder of .txt files (or one file)
  val_path: /scratch/<project>/<username>/data/val.txt           # optional: leave the line out for no validation data
  format_options:
    text_split: file            # file | paragraphs | lines: what one example is
    chunk: true                 # cut each example into seq_len pieces instead of keeping only the first
  seq_len: 4096
  cache_dir: /scratch/<project>/<username>/cache
  overwrite_cache: false
  num_workers: 46               # CPU workers on one 48-core node
  tokenize_batch_size: 64
  tokenize_compression: snappy
