# Bhaskera recipe: param-1-2.9b-ddp
# Model    : bharatgenai/Param-1-2.9B-Instruct   (download to /scratch/<project>/<username>/models/Param-1-2.9B-Instruct)
# Strategy : DDP, dense 2.9 B
# Measured on PARAM Rudra (Nov 2026, seq_len 4096, 5 nodes = 10 x A100 80 GB, 10 steps):
#            1.57 s/step, 24 GiB per GPU, 11% MFU (74% of each batch is padding: this model supports neither flash-attention nor packing)
# Nodes    : any node count
# Throughput test only: no model-quality evaluation has been done for this model.
#
# Before use: replace every <project>/<username>, and set data.tokenized_path /
# data.val_tokenized_path to the two lines printed by the tokenize job.
# Run with:  ./submit.sh recipes/param-1-2.9b-ddp.yaml <nodes> <hours>
model:
  name: /scratch/<project>/<username>/models/Param-1-2.9B-Instruct
  dtype: bfloat16
  attn_impl: eager
  trust_remote_code: true
  use_liger_kernel: true
data:
  name: local
  seq_len: 4096
  num_workers: 16
  tokenized_path: /scratch/<project>/<username>/cache/REPLACE_local_train_<hash>
  val_tokenized_path: /scratch/<project>/<username>/cache/REPLACE_local_val_<hash>
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10
  runtime_packing: false
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - auto
  include_experts: false
  freeze_router: true
  modules_to_save: []
training:
  batch_size: 1
  grad_accum: 1
  lr: 0.0001
  weight_decay: 0.0
  max_steps: 10
  num_epochs: 1
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false
  eval_steps: 200
  eval_batch_size: 1
  target_eval_loss: null
  distributed:
    strategy: ddp
    fsdp:
      sharding_strategy: FULL_SHARD
      transformer_layer_cls: []
      param_dtype: bfloat16
      reduce_dtype: bfloat16
      buffer_dtype: bfloat16
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false
  eval_max_rows: 1000
checkpoint:
  enabled: true
  save_dir: /scratch/<project>/<username>/bhaskera-runs/checkpoints/param-1-2.9b-ddp
  save_interval: 1
  keep_last_n: 2
logging:
  tracker: mlflow
  project: bhaskera
  run_name: param-1-2.9b-ddp
  mlflow_tracking_uri: ''
  log_gpu_every_n_steps: 10
monitoring:
  dashboard: true
  dashboard_host: 0.0.0.0
  dashboard_port: 8265
  metrics_export_port: 8080
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 5
