# ExaAI cluster profile: copy to ~/.bhaskera/cluster.yaml (or point $BHASKERA_CLUSTER_PROFILE at it) and edit.
# Every line is optional. Without a profile, submit.sh uses $BHASKERA_PARTITION and skips the partition-limit checks.
name: My Cluster          # shown on the ExaAI dashboard
gpus_per_node: 8
gpu_mem_gb: 80         # memory of one GPU in GB, for the "will it fit" check before a job is submitted
cpus_per_node: 64         # CPUs asked for on each node
mem_per_node: 400G        # host memory asked for on each node
net_interface: ib0        # network interface for NCCL and Ray (check with: ip -4 addr); "" = not checked
# download_hosts: [login1, login2]   # machines with internet, for downloads when the machine running the page has none
docs_url: https://example.org/bhaskera
partitions:               # smallest jobs first; max_hours is the partition's time limit
  - {max_nodes: 2,  name: debug, max_hours: 1}
  - {max_nodes: 32, name: gpu,   max_hours: 48}
