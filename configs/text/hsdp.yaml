# Text, HSDP: shard inside a group of GPUs, replicate across groups (HYBRID_SHARD). LoRA on Llama-3.3-70B.
# Tokenise first (configs/text/tokenize.yaml), put the two printed paths below, replace <project>/<username>, then:
#   ./submit.sh configs/text/hsdp.yaml <nodes> <hours>

model:
  name: "/scratch/<project>/<username>/models/Llama-3.3-70B-Instruct"
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  trust_remote_code: false
  use_liger_kernel: true

data:
  name: "local"
  seq_len: 4096
  runtime_packing: true          # pack several examples per 4096-token row (requires flash_attention_2)
  num_workers: 64
  tokenized_path: "/scratch/<project>/<username>/cache/local_train_<hash>"
  val_tokenized_path: "/scratch/<project>/<username>/cache/local_val_<hash>"
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["auto"]
  include_experts: false
  freeze_router: true
  modules_to_save: []

training:
  batch_size: 2                  # all accumulation folded into one micro-batch: one weight gather per step
                                  # was cut 16384 -> 4096 after measuring the real
                                  # Nemotron chat distribution (p50=2108, p75=4522):
                                  # 16384 padded ~80% of every sequence, which both
                                  # jammed tokenisation I/O (194GB output) and would
                                  # have burned ~80% of training FLOPs on padding.
  grad_accum: 1                  # same sequences per step as the earlier rerun
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 20
  num_epochs: 3
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false

  eval_steps: 0                  # throughput rerun: no eval
  eval_batch_size: 1
  target_eval_loss: null

  distributed:
    strategy: "fsdp"

    fsdp:
      sharding_strategy: "HYBRID_SHARD"
      hsdp_shard_size: 16
      transformer_layer_cls: []
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true

    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false

checkpoint:
  enabled: false
  save_dir: "./checkpoints/llama33_70b-fsdp-32node-hsdp16"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "mlflow"
  project: "bhaskera"
  run_name: "llama33_70b-fsdp-32node-hsdp16"
  mlflow_tracking_uri: ""
  log_gpu_every_n_steps: 10

monitoring:
  dashboard: true
  dashboard_host: "127.0.0.1"
  dashboard_port: 8265
  metrics_export_port: 8080

  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 5
