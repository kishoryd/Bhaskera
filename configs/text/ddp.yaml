# Text, DDP: the whole model on every GPU. LoRA on Qwen3-14B.
# Tokenise first (configs/text/tokenize.yaml), put the two printed paths below, replace <project>/<username>, then:
#   ./submit.sh configs/text/ddp.yaml <nodes> <hours>

model:
  name: "/scratch/<project>/<username>/models/Qwen3-14B"
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  trust_remote_code: false
  use_liger_kernel: true

data:
  name: "ultrachat"
  seq_len: 4096
  num_workers: 16
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["auto"]
  include_experts: false
  freeze_router: true
  modules_to_save: []

training:
  batch_size: 4                 # per-GPU micro-batch at seq_len 4096 with the Liger fused loss
  grad_accum: 2                # effective batch = 16 GPUs x 4 x 2 = 128 sequences/step
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 1000
  num_epochs: 1
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false

  distributed:
    strategy: "ddp"

    fsdp:
      sharding_strategy: "FULL_SHARD"
      transformer_layer_cls: []            # empty -> auto-detect via introspect.py
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true

    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false

checkpoint:
  enabled: true
  save_dir: "./checkpoints/qwen3_14b-ultrachat-ddp-8node"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "mlflow"
  project: "bhaskera"
  run_name: "qwen3_14b-ultrachat-ddp-8node"
  mlflow_tracking_uri: ""
  log_gpu_every_n_steps: 10

monitoring:
  dashboard: true
  dashboard_host: "127.0.0.1"
  dashboard_port: 8265
  metrics_export_port: 8080

  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0     # A100 bf16 peak
    throughput_window: 5
    throughput_warmup: 5
