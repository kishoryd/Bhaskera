# =============================================================================
# Bhaskera — Mistral-Large-Instruct-2411 | LoRA SFT on nvidia/Nemotron-Cascade-2-SFT-Data (chat)
# Strategy: FSDP | 64 nodes x 2 GPUs/node = 128 GPUs
#
# One of a 6-model dense/MoE comparison, all on the same dataset, same LoRA
# rank (r16/alpha32), same node count — see:
#   configs/qwen3_14b_ddp_8node_nemotron.yaml       DENSE
#   configs/llama33_70b_fsdp_8node_nemotron.yaml    DENSE
#   configs/mistral_large_fsdp_8node_nemotron.yaml  DENSE  (this file)
#   configs/qwen3_30b_a3b_fsdp_8node_nemotron.yaml  MOE
#   configs/gpt_oss_120b_fsdp_8node_nemotron.yaml   MOE
#   configs/qwen3_235b_a22b_fsdp_8node_nemotron.yaml MOE
#
# EVAL-BASELINE RUN: eval_steps on, target_eval_loss unset — first run for
# each of these 6 models, so no prior cutoff exists to apply yet.
#
# Prereq (run once):
#   bhaskera-tokenize --config configs/tokenize_mistral_large_nemotron.yaml --split both
#
# SLURM:
#   sbatch scripts/submit_mistral_large_fsdp_64_nemotron.sh
# =============================================================================

model:
  name: "/scratch/nsmapplication/dlapp/wk-kishor/Bhaskera/models/Mistral-Large-Instruct-2411"
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  trust_remote_code: false
  use_liger_kernel: true

data:
  name: "local"
  seq_len: 4096
  runtime_packing: true          # pack several examples per 4096-token row (requires flash_attention_2)
  num_workers: 128
  tokenized_path: "/scratch/nsmapplication/dlapp/wk-kishor/Bhaskera/data1/local_train_f75d6fdfd2d0289a"
  val_tokenized_path: "/scratch/nsmapplication/dlapp/wk-kishor/Bhaskera/data1/local_val_91690cbe05254609"
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["auto"]
  include_experts: false
  freeze_router: true
  modules_to_save: []

training:
  batch_size: 1                  # all accumulation folded into one micro-batch: one weight gather per step
                                  # was cut 16384 -> 4096 after measuring the real
                                  # Nemotron chat distribution (p50=2108, p75=4522):
                                  # 16384 padded ~80% of every sequence, which both
                                  # jammed tokenisation I/O (194GB output) and would
                                  # have burned ~80% of training FLOPs on padding.
  grad_accum: 1                  # same sequences per step as the earlier rerun
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 20
  num_epochs: 3
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false

  eval_steps: 0                  # throughput rerun: no eval
  eval_batch_size: 1
  target_eval_loss: null

  distributed:
    strategy: "fsdp"

    fsdp:
      sharding_strategy: "FULL_SHARD"
      transformer_layer_cls: []
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true

    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false

checkpoint:
  enabled: false
  save_dir: "./checkpoints/mistral_large-fsdp-64node-v2"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "mlflow"
  project: "bhaskera"
  run_name: "mistral_large-fsdp-64node-v2"
  mlflow_tracking_uri: ""
  log_gpu_every_n_steps: 10

monitoring:
  dashboard: true
  dashboard_host: "0.0.0.0"
  dashboard_port: 8265
  metrics_export_port: 8080

  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 5
