model:
  name: /scratch/nsmapplication/dlapp/wk-kishor/bhaskera/Bhaskera/models/Llama-3.3-70B-Instruct
  dtype: bfloat16
  attn_impl: flash_attention_2
  trust_remote_code: false
  use_liger_kernel: true
data:
  name: local
  seq_len: 4096
  num_workers: 16
  tokenized_path: /scratch/nsmapplication/dlapp/wk-kishor/bhaskera/Bhaskera/data1/local_train_8cdbf2efca87eadc
  val_tokenized_path: /scratch/nsmapplication/dlapp/wk-kishor/bhaskera/Bhaskera/data1/local_val_866a9ad43a19c703
  prefetch_batches: 2
  local_shuffle_buffer_multiplier: 10
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - auto
  include_experts: false
  freeze_router: true
  modules_to_save: []
training:
  batch_size: 1
  grad_accum: 1
  lr: 0.0001
  weight_decay: 0.0
  max_steps: 10
  num_epochs: 1
  warmup_steps: 50
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 100
  seed: 42
  deterministic: false
  eval_steps: 0
  eval_batch_size: 1
  target_eval_loss: null
  distributed:
    strategy: fsdp
    fsdp:
      sharding_strategy: FULL_SHARD
      transformer_layer_cls: []
      param_dtype: bfloat16
      reduce_dtype: bfloat16
      buffer_dtype: bfloat16
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false
      root_reshard_after_forward: false
      forward_prefetch: true
      backward_prefetch: true
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false
checkpoint:
  enabled: false
  save_dir: ./checkpoints/llama33_70b-nemotron-fsdp-8node
  save_interval: 1
  keep_last_n: 2
logging:
  tracker: mlflow
  project: bhaskera
  run_name: rel-fsdp-llama70b
  mlflow_tracking_uri: ''
  log_gpu_every_n_steps: 10
monitoring:
  dashboard: true
  dashboard_host: 0.0.0.0
  dashboard_port: 8265
  metrics_export_port: 8080
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 5
