<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" width="1000" height="712" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Bhaskera works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1c17"/>
    </marker>
    <style>
      .t { font: 500 22px Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; fill: #1f1c17 }
      .h { font: 600 12px system-ui, 'Segoe UI', Arial, sans-serif; fill: #6c6555; letter-spacing: .08em }
      .b { font: 600 14px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f1c17 }
      .s { font: 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #3d382d }
      .n { font: italic 12.5px system-ui, 'Segoe UI', Arial, sans-serif; fill: #6c6555 }
      .band { fill: #f6f2e9; stroke: #1f1c17; stroke-width: 1 }
      .box { fill: #ffffff; stroke: #b9ae94; stroke-width: 1 }
      .ar { stroke: #1f1c17; stroke-width: 1.4; fill: none; marker-end: url(#a) }
    </style>
  </defs>

  <rect width="1000" height="712" fill="#ffffff"/>
  <text x="24" y="36" class="t">How Bhaskera works</text>

  <!-- you -->
  <rect x="20" y="54" width="960" height="136" rx="3" class="band"/>
  <text x="38" y="78" class="h">YOU, ON THE LOGIN NODE</text>
  <rect x="38" y="90" width="196" height="58" rx="3" class="box"/>
  <text x="136" y="114" text-anchor="middle" class="b">Your data</text>
  <text x="136" y="134" text-anchor="middle" class="s">chat JSONL, with media</text>
  <rect x="268" y="90" width="196" height="58" rx="3" class="box"/>
  <text x="366" y="114" text-anchor="middle" class="b">Tokenise once</text>
  <text x="366" y="134" text-anchor="middle" class="s">a cache of token ids</text>
  <rect x="498" y="90" width="196" height="58" rx="3" class="box"/>
  <text x="596" y="114" text-anchor="middle" class="b">A recipe (YAML)</text>
  <text x="596" y="134" text-anchor="middle" class="s">model, data, parallelism</text>
  <rect x="728" y="90" width="234" height="58" rx="3" class="box"/>
  <text x="845" y="114" text-anchor="middle" class="b">submit.sh</text>
  <text x="845" y="134" text-anchor="middle" class="s">checks it, picks the partition</text>
  <path d="M234,119 H266" class="ar"/>
  <path d="M464,119 H496" class="ar"/>
  <path d="M694,119 H726" class="ar"/>
  <text x="38" y="174" class="n">Partitions, time limits, GPUs per node and the network interface come from a cluster profile, so nothing here is tied to one site.</text>
  <path d="M845,190 V214" class="ar"/>

  <!-- job -->
  <rect x="20" y="214" width="960" height="252" rx="3" class="band"/>
  <text x="38" y="238" class="h">THE SLURM JOB: YOUR NODES, ONE RAY CLUSTER</text>
  <rect x="38" y="250" width="150" height="34" rx="3" class="box"/>
  <text x="113" y="272" text-anchor="middle" class="s">Ray head, node 1</text>
  <rect x="204" y="250" width="190" height="34" rx="3" class="box"/>
  <text x="299" y="272" text-anchor="middle" class="s">Ray workers, nodes 2 to N</text>
  <text x="414" y="272" class="n">one training worker per GPU; every node is checked before training starts</text>
  <rect x="38" y="298" width="924" height="156" rx="3" fill="none" stroke="#b9ae94" stroke-dasharray="5 4"/>
  <text x="54" y="318" class="h">EACH GPU WORKER</text>

  <rect x="54" y="328" width="204" height="116" rx="3" class="box"/>
  <text x="68" y="350" class="b">1  Data</text>
  <text x="68" y="372" class="s">Ray Data reads the cache</text>
  <text x="68" y="391" class="s">packed, no padding</text>
  <text x="68" y="410" class="s">images, video, audio</text>
  <text x="68" y="427" class="s">are decoded on the fly</text>

  <rect x="284" y="328" width="204" height="116" rx="3" class="box"/>
  <text x="298" y="350" class="b">2  Model</text>
  <text x="298" y="372" class="s">Hugging Face model</text>
  <text x="298" y="391" class="s">LoRA adapters; 4-bit</text>
  <text x="298" y="410" class="s">base for QLoRA; frozen</text>
  <text x="298" y="427" class="s">vision and audio encoders</text>

  <rect x="514" y="328" width="204" height="116" rx="3" class="box"/>
  <text x="528" y="350" class="b">3  Parallelism</text>
  <text x="528" y="372" class="s">DDP, QLoRA + DDP</text>
  <text x="528" y="391" class="s">Pipeline, FSDP2, HSDP</text>
  <text x="528" y="410" class="s">only small adapter</text>
  <text x="528" y="427" class="s">gradients cross nodes *</text>

  <rect x="744" y="328" width="204" height="116" rx="3" class="box"/>
  <text x="758" y="350" class="b">4  Training</text>
  <text x="758" y="372" class="s">loss, evaluation, MFU</text>
  <text x="758" y="391" class="s">checkpoints, and resume</text>
  <text x="758" y="410" class="s">after a failure, a</text>
  <text x="758" y="427" class="s">plain explanation</text>
  <path d="M258,386 H282" class="ar"/>
  <path d="M488,386 H512" class="ar"/>
  <path d="M718,386 H742" class="ar"/>
  <path d="M500,466 V490" class="ar"/>

  <!-- results -->
  <rect x="20" y="490" width="960" height="84" rx="3" class="band"/>
  <text x="38" y="512" class="h">WHAT YOU GET</text>
  <rect x="38" y="522" width="292" height="40" rx="3" class="box"/>
  <text x="184" y="547" text-anchor="middle" class="s">LoRA adapter and checkpoints</text>
  <rect x="354" y="522" width="292" height="40" rx="3" class="box"/>
  <text x="500" y="547" text-anchor="middle" class="s">A job log, one line per step</text>
  <rect x="670" y="522" width="292" height="40" rx="3" class="box"/>
  <text x="816" y="547" text-anchor="middle" class="s">MLflow runs and curves</text>
  <path d="M500,574 V598" class="ar"/>

  <!-- home page -->
  <rect x="20" y="598" width="960" height="84" rx="3" class="band"/>
  <text x="38" y="620" class="h">THE HOME PAGE (bhaskera-dashboard ray)</text>
  <rect x="38" y="630" width="214" height="40" rx="3" class="box"/>
  <text x="145" y="655" text-anchor="middle" class="s">Your jobs and runs</text>
  <rect x="268" y="630" width="214" height="40" rx="3" class="box"/>
  <text x="375" y="655" text-anchor="middle" class="s">Start a job</text>
  <rect x="498" y="630" width="214" height="40" rx="3" class="box"/>
  <text x="605" y="655" text-anchor="middle" class="s">Chat with the tuned model</text>
  <rect x="728" y="630" width="234" height="40" rx="3" class="box"/>
  <text x="845" y="655" text-anchor="middle" class="s">Benchmark it against its base</text>

  <text x="24" y="702" class="n">* FSDP and HSDP also move the frozen weights between GPUs every step. Start, chat and benchmark run the same submit.sh as the terminal.</text>
</svg>
