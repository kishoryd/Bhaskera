<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Bhaskera architecture on PARAM Rudra</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" rx="14" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Bhaskera on PARAM Rudra: one YAML recipe → multi-node LoRA / QLoRA fine-tuning</text>

  <!-- Row 1: login node -->
  <rect x="24" y="56" width="952" height="112" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="40" y="78" font-size="13" font-weight="700" fill="#3730a3">LOGIN NODE (no GPU)  ·  CPU node for tokenising</text>
  <g font-size="13" fill="#1e293b">
    <rect x="40" y="90" width="150" height="60" rx="8" fill="#fff" stroke="#6366f1"/>
    <text x="115" y="115" text-anchor="middle" font-weight="600">Your data</text>
    <text x="115" y="134" text-anchor="middle" font-size="11.5">JSONL conversations</text>
    <rect x="222" y="90" width="170" height="60" rx="8" fill="#fff" stroke="#6366f1"/>
    <text x="307" y="115" text-anchor="middle" font-weight="600">tokenize.sbatch</text>
    <text x="307" y="134" text-anchor="middle" font-size="11.5">→ Parquet cache (once)</text>
    <rect x="424" y="90" width="150" height="60" rx="8" fill="#fff" stroke="#6366f1"/>
    <text x="499" y="115" text-anchor="middle" font-weight="600">Recipe (YAML)</text>
    <text x="499" y="134" text-anchor="middle" font-size="11.5">model · data · strategy</text>
    <rect x="606" y="90" width="170" height="60" rx="8" fill="#fff" stroke="#6366f1"/>
    <text x="691" y="115" text-anchor="middle" font-weight="600">submit.sh</text>
    <text x="691" y="134" text-anchor="middle" font-size="11.5">preflight: files, libs, memory fit</text>
    <rect x="808" y="90" width="152" height="60" rx="8" fill="#fff" stroke="#6366f1"/>
    <text x="884" y="115" text-anchor="middle" font-weight="600">sbatch</text>
    <text x="884" y="134" text-anchor="middle" font-size="11.5">partition + walltime chosen</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="190" y1="120" x2="220" y2="120"/>
    <line x1="392" y1="120" x2="422" y2="120"/>
    <line x1="574" y1="120" x2="604" y2="120"/>
    <line x1="776" y1="120" x2="806" y2="120"/>
    <line x1="884" y1="150" x2="884" y2="190"/>
  </g>

  <!-- Row 2: SLURM job / Ray cluster -->
  <rect x="24" y="192" width="952" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="40" y="214" font-size="13" font-weight="700" fill="#166534">SLURM JOB: N GPU nodes × 2 A100 80 GB  ·  train.sbatch starts one Ray cluster over InfiniBand (ib0)</text>
  <g font-size="12" fill="#1e293b">
    <rect x="40" y="226" width="140" height="34" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="110" y="248" text-anchor="middle">Ray head (node 1)</text>
    <rect x="196" y="226" width="140" height="34" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="266" y="248" text-anchor="middle">Ray worker (node 2)</text>
    <text x="362" y="248" font-size="16" fill="#166534">…</text>
    <rect x="390" y="226" width="140" height="34" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="460" y="248" text-anchor="middle">Ray worker (node N)</text>
    <text x="552" y="248" font-size="12" fill="#166534">→ Ray Train: one training worker per GPU (2 × N)</text>
  </g>

  <!-- worker internals -->
  <rect x="40" y="274" width="920" height="204" rx="8" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/>
  <text x="56" y="294" font-size="12.5" font-weight="700" fill="#166534">EACH GPU WORKER</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="304" width="200" height="160" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <text x="156" y="326" text-anchor="middle" font-weight="700" fill="#155e75">1 · Data</text>
    <text x="70" y="350">Ray Data reads its shard</text>
    <text x="70" y="370">of the Parquet cache</text>
    <text x="70" y="394">Runtime sequence packing:</text>
    <text x="70" y="414">no compute on padding</text>
    <text x="70" y="438">Held-out validation set</text>

    <rect x="276" y="304" width="210" height="160" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="381" y="326" text-anchor="middle" font-weight="700" fill="#92400e">2 · Model</text>
    <text x="290" y="350">Hugging Face loader</text>
    <text x="290" y="370">Introspection: layers, experts,</text>
    <text x="290" y="390">routers, LoRA targets (any arch)</text>
    <text x="290" y="414">LoRA adapters (PEFT); frozen</text>
    <text x="290" y="434">base in bf16 or 4-bit (QLoRA)</text>
    <text x="290" y="454">Liger fused kernels, flash-attn</text>

    <rect x="506" y="304" width="210" height="160" rx="8" fill="#fae8ff" stroke="#a21caf"/>
    <text x="611" y="326" text-anchor="middle" font-weight="700" fill="#86198f">3 · Parallelism</text>
    <text x="520" y="350">QLoRA + DDP  (dense ≤ 123 B)</text>
    <text x="520" y="370">DDP  (fits one GPU)</text>
    <text x="520" y="390">Pipeline 1F1B / GPipe</text>
    <text x="534" y="408" font-size="11">(MoE + very large models)</text>
    <text x="520" y="430">FSDP2 / HSDP</text>
    <text x="520" y="452" font-size="11">only LoRA grads cross nodes*</text>

    <rect x="736" y="304" width="208" height="160" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="840" y="326" text-anchor="middle" font-weight="700" fill="#991b1b">4 · Training loop</text>
    <text x="750" y="350">Loss + MoE aux / z-loss</text>
    <text x="750" y="370">AdamW on LoRA weights</text>
    <text x="750" y="390">Eval: loss + next-token acc.</text>
    <text x="750" y="414">Per-step tok/s, MFU, peak mem</text>
    <text x="750" y="434">Watchdog, straggler check</text>
    <text x="750" y="454">Checkpoint + resume</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="256" y1="384" x2="274" y2="384"/>
    <line x1="486" y1="384" x2="504" y2="384"/>
    <line x1="716" y1="384" x2="734" y2="384"/>
    <line x1="500" y1="492" x2="500" y2="520"/>
  </g>

  <!-- Row 3: outputs -->
  <rect x="24" y="522" width="952" height="86" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="40" y="544" font-size="13" font-weight="700" fill="#334155">OUTPUTS on /scratch</text>
  <g font-size="12.5" fill="#1e293b">
    <rect x="40" y="554" width="290" height="40" rx="7" fill="#fff" stroke="#64748b"/>
    <text x="185" y="579" text-anchor="middle">LoRA adapter + sharded checkpoints</text>
    <rect x="355" y="554" width="290" height="40" rx="7" fill="#fff" stroke="#64748b"/>
    <text x="500" y="579" text-anchor="middle">Job log: one metrics line per step</text>
    <rect x="670" y="554" width="290" height="40" rx="7" fill="#fff" stroke="#64748b"/>
    <text x="815" y="579" text-anchor="middle">MLflow dashboard (login node)</text>
  </g>
  <text x="976" y="628" text-anchor="end" font-size="10.5" fill="#64748b">* DDP, QLoRA and Pipeline; FSDP / HSDP also move frozen weights between GPUs every step</text>
</svg>
